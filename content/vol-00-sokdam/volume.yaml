title: 속담
summary: |
  짧은 말일수록 오래 남습니다. 네 편의 속담을 인터랙티브 아트워크로 옮겨, 문장이 품고 있던 장면을 화면 위에서 직접 만져볼 수 있게 했습니다.

  앞으로 이어질 볼륨이 어떤 모습일지 미리 보여 드리는 자리이기도 합니다. 천천히 둘러보시고, 다음 볼륨에도 함께해 주세요.
