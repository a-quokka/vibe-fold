description: |
  달의 여신 셀레네가 저무는 이의 이야기를 들어요. 벗과 사랑과 재물과 이름 앞에서 그대가 어떤 사람이었는지 네 번을 물어요.

  고른 것들은 별가루가 되어 그릇에 모이고, 마지막에 한 점으로 합쳐져요. 밤하늘에는 그대의 이름이 새겨진 별 하나가 남아요.
