title: 셀레네 밤의 여신
creator: a-quokka
description: |
  달의 여신 셀레네가 생을 마친 이를 불러 네 가지를 묻는다. 벗과 사랑, 재물과 이름 가운데 무엇을 붙잡고 살았는지 하나씩 답해야 한다.

  고른 답은 별가루가 되어 그릇에 쌓이고, 마지막에 한 점으로 모인다. 밤하늘에는 그 사람의 이름이 새겨진 별 하나가 남는다.
