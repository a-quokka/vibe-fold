id: ch-haewa-dari-doen-onui
slug: haewa-dari-doen-onui
title: 해와 달이 된 오누이
creator: uja
description: |
  호랑이는 고개를 넘을 때마다 떡을 빼앗아 먹고, 떡이 바닥나자 어머니마저 데려간다. 그러고는 어머니의 목소리를 꾸며 오누이의 집을 찾아와 문틈으로 손을 들이민다.

  오누이는 나무 위로 달아나 하늘에 빈다. 동아줄 두 개가 내려오고, 끝까지 오른 오누이는 해와 달이 된다. 썩은 줄을 잡은 호랑이가 떨어진 자리에서는 수수가 붉게 물든다.
