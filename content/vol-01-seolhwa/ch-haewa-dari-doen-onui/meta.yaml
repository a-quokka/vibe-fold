title: 해와 달이 된 오누이
creator: uja
description: |
  호랑이가 고개마다 떡을 받아 가고, 떡이 다하자 어머니를 데려갑니다. 어머니의 목소리로 찾아온 것이 문틈으로 손을 들이밉니다.

  오누이는 나무 위로 달아나 하늘에 빕니다. 동아줄 두 개가 내려옵니다. 끝까지 오르면 해와 달이 되고, 썩은 줄을 잡으면 수수밭이 술렁입니다.
