slug: haewa-dari-doen-onui
title: 해와 달이 된 오누이
creator: uja
description: |
  호랑이가 고개를 넘을 때마다 떡을 받아 가고, 떡이 다하자 어머니마저 데려가요. 어머니의 목소리를 흉내 내며 찾아온 것이 문틈으로 손을 들이밀어요.

  오누이는 나무 위로 달아나 하늘에 빌어요. 동아줄 두 개가 내려와요. 끝까지 오른 쪽은 해와 달이 되고, 썩은 줄을 잡은 쪽이 떨어진 자리에서는 수수밭이 술렁여요.
