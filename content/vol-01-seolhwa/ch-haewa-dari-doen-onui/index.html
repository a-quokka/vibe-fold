<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>해와 달이 된 오누이</title>
		<style>
			/* ==================================================================
			   Design tokens — scoped to this chapter.
			   Palette is the artwork's own: night sky, lamp gold, rope straw.
			   ================================================================== */

			@font-face {
				font-family: "Fold Serif";
				src: url("fonts/serif-400.woff2") format("woff2");
				font-weight: 400;
				font-style: normal;
				font-display: block;
			}

			@font-face {
				font-family: "Fold Serif";
				src: url("fonts/serif-600.woff2") format("woff2");
				font-weight: 600;
				font-style: normal;
				font-display: block;
			}

			:root {
				/* Noto Serif KR, subset to the 60 glyphs this piece renders.
				   font-display: block — a flash of Helvetica would break the scene. */
				--font-display: "Fold Serif", "Apple SD Gothic Neo", serif;
				--font-text: "Fold Serif", "Apple SD Gothic Neo", serif;

				/* Ink */
				--gold: #f2e6c6;
				--gold-dim: #ddcda4;
				--gold-faint: #b5a480;
				--night: #10132b;
				--night-deep: #080a16;

				/* Scale — the title carries the piece, the hint recedes. */
				--text-title: clamp(2.5rem, 7vw, 5rem);
				--text-end: clamp(1.75rem, 5vw, 3.5rem);
				--text-caption: 0.875rem;
				--text-hint: 0.8125rem;

				/* Korean display type opens up badly without negative tracking. */
				--track-title: -0.045em;
				--track-end: -0.04em;
				--track-caption: 0;

				--lh-title: 1.12;
				--lh-caption: 1.65;

				/* Legibility over both the night sky and the dawn ending. */
				--halo: 0 1px 3px rgba(8, 10, 22, 0.55), 0 0 22px rgba(8, 10, 22, 0.35);

				--ease: cubic-bezier(0.16, 1, 0.3, 1);
				--dur: 550ms;
				--dur-slow: 700ms;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: var(--night);
				touch-action: none;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}

			/* ---- Caption ---------------------------------------------------- */

			.caption {
				position: fixed;
				left: 50%;
				bottom: 7%;
				transform: translateX(-50%);
				width: min(90%, 34rem);
				text-align: center;
				color: var(--gold-dim);
				pointer-events: none;
				font-family: var(--font-text);
				font-weight: 400;
				text-shadow: var(--halo);
				transition: opacity var(--dur) var(--ease);
			}

			.caption p {
				margin: 0;
				font-size: var(--text-caption);
				line-height: var(--lh-caption);
				letter-spacing: var(--track-caption);
				word-break: keep-all;
			}

			.caption .en,
			.caption .ko {
				transition: opacity var(--dur) var(--ease);
			}

			.caption .ko {
				margin-top: 0.15rem;
				color: var(--gold);
			}

			.caption .hint {
				margin-top: 0.9rem;
				font-size: var(--text-hint);
				color: var(--gold-faint);
			}

			/* ---- Title & endcard --------------------------------------------- */

			.title,
			.endcard {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.06em;
				color: var(--gold);
				pointer-events: none;
				text-align: center;
				word-break: keep-all;
				font-family: var(--font-display);
				font-weight: 600;
				font-size: var(--text-title);
				line-height: var(--lh-title);
				letter-spacing: var(--track-title);
				text-shadow: var(--halo);
				transition: opacity var(--dur) var(--ease);
			}

			.endcard {
				opacity: 0;
				padding: 0 7vw;
				font-size: var(--text-end);
				letter-spacing: var(--track-end);
			}

			.endcard .sub,
			.endcard .again {
				margin: 1.35rem 0 0;
				font-family: var(--font-text);
				font-weight: 400;
				font-size: var(--text-caption);
				line-height: var(--lh-caption);
				letter-spacing: var(--track-caption);
				color: var(--gold-dim);
			}

			.endcard .again {
				margin-top: 2.6rem;
				font-size: var(--text-hint);
				letter-spacing: 0.22em;
				text-indent: 0.22em; /* balance the trailing tracking when centred */
				color: var(--gold-dim);
				opacity: 0;
				transition: opacity var(--dur-slow) var(--ease);
			}

			/* The blackout has to cover the text as well as the canvas, so it is a
			   layer of its own, last in the document. */
			.veil {
				position: fixed;
				inset: 0;
				background: var(--night-deep);
				opacity: 0;
				pointer-events: none;
			}

			@media (prefers-reduced-motion: reduce) {
				.caption,
				.title,
				.endcard,
				.endcard .again {
					transition-duration: 0.01ms;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<div class="title" id="title">
			<span>해와 달이 된</span>
			<span>오누이</span>
		</div>
		<div class="endcard" id="endcard">
			<span id="endko"></span>
			<p class="sub" id="enden"></p>
			<p class="again" id="endagain">다시</p>
		</div>
		<div class="caption" id="caption">
			<p class="en" id="en">Two ropes come down. Only one of them holds.</p>
			<p class="ko" id="ko">해와 달이 된 오누이</p>
			<p class="hint" id="hint">줄을 붙잡고 있으면 올라갑니다</p>
		</div>
		<div class="veil" id="veil"></div>

		<script>
			const cv = document.getElementById("c");
			const ctx = cv.getContext("2d");
			const elTitle = document.getElementById("title");
			const elEn = document.getElementById("en");
			const elKo = document.getElementById("ko");
			const elHint = document.getElementById("hint");
			const elCap = document.getElementById("caption");
			const elEnd = document.getElementById("endcard");
			const elEndKo = document.getElementById("endko");
			const elEndEn = document.getElementById("enden");
			const elAgain = document.getElementById("endagain");
			const elVeil = document.getElementById("veil");

			const TAU = Math.PI * 2;
			// How far the stars drift from bone-white toward gold. 0 = the old look.
			const STAR_WARMTH = 0.55;
			// Strength of the paper laid over the whole scene. 0 = no texture.
			const GRAIN_ALPHA = 0.085;
			// Haze that drifts past as you climb, for a sense of moving through air.
			// 0 = no haze at all; the sky keeps its clean gradient but the ascent
			// loses one of its parallax layers.
			const MIST_STRENGTH = 0;
			// How far the world scrolls for one full climb, and how long holding on takes.
			let w = 0;
			let h = 0;
			let dpr = 1;
			let t = 0;
			let last = performance.now();

			function clamp01(v) {
				return v < 0 ? 0 : v > 1 ? 1 : v;
			}

			function mix(a, b, k) {
				return a + (b - a) * k;
			}

			function mixArr(a, b, k) {
				return [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];
			}

			function rgb(a, b, k) {
				return (
					"rgb(" +
					Math.round(mix(a[0], b[0], k)) +
					"," +
					Math.round(mix(a[1], b[1], k)) +
					"," +
					Math.round(mix(a[2], b[2], k)) +
					")"
				);
			}

			function resize() {
				dpr = Math.min(window.devicePixelRatio || 1, 2);
				w = window.innerWidth;
				h = window.innerHeight;
				cv.width = Math.round(w * dpr);
				cv.height = Math.round(h * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			}

			const scale = () => Math.max(1, Math.min(w, h) / 300);

			// Bone-white to gold. Returns the "rgba(r,g,b," prefix; the twinkle
			// supplies the alpha each frame. Every scene with a night sky wants it.
			// Pointer or first touch, in CSS pixels. Every scene that takes input
			// needs it.
			function pos(e) {
				const p = e.touches ? e.touches[0] : e;
				return { x: p.clientX, y: p.clientY };
			}

			function starColour(warm) {
				const c = mixArr([236, 226, 196], [247, 205, 130], warm * STAR_WARMTH);
				return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ",";
			}

			// Optional painted assets. Each one is drawn if it loads and silently
			// ignored if it does not, so the piece never depends on a file landing.
			// Local paths only — the chapter must not reach the network.
			const art = {};

			function loadArt(name, src) {
				const img = new Image();
				img.onload = () => {
					art[name] = img;
				};
				img.src = src;
			}

			// Both climber poses share one canvas: same silhouette mass, fists on the
			// same spot, so swapping them never makes the child jump. Measured off the
			// artwork, not guessed.
			const CLIMBER_GRIP = 0.7188; // fists, as a fraction of asset width
			const CLIMBER_ASSET_H = 1.0527; // asset height / the body height it stands in for

			loadArt("sun", "assets/sun.webp");
			loadArt("moon", "assets/moon.webp");
			loadArt("climberUp", "assets/climber-up.webp");
			loadArt("climberHang", "assets/climber-hang.webp");
			loadArt("climberFall", "assets/climber-fall.webp");
			loadArt("mother", "assets/mother.webp");
			loadArt("siblings", "assets/siblings.webp");
			loadArt("branch", "assets/branch.webp");
			loadArt("siblingsDoor", "assets/siblings-door.webp");
			loadArt("paw", "assets/paw.webp");
			for (let i = 0; i < 4; i++) loadArt("ridge" + i, "assets/ridge-" + i + ".webp");
			for (let i = 0; i < 4; i++) loadArt("stalk" + i, "assets/stalk-" + i + ".webp");

			// The falling pose is centred on its own mass, not on the fists — it spins
			// about local (0,0) and holding nothing.
			const CLIMBER_FALL_H = 0.8711;

			// Draws the child. `img` is the painted pose, or null to fall back to the
			// figure this piece was built from. "grip" lands the fists on local x = 0
			// at the height a rope would be, mirrored when the body hangs off the
			// other side; "mass" centres the drawing on (x, y) so it spins about
			// itself. Shared, because every scene that shows a person needs it.
			function drawFigure(img, x, y, s, rot, side, anchor) {
				const dx = side * 5.6 * s;
				ctx.save();
				ctx.translate(x, y);
				ctx.rotate(rot);

				if (img && anchor === "mass") {
					const fh = 30 * s * CLIMBER_FALL_H;
					const fw = fh * (img.width / img.height);
					ctx.drawImage(img, -fw / 2, -fh / 2, fw, fh);
					ctx.restore();
					return;
				}

				if (img) {
					const fh = 30 * s * CLIMBER_ASSET_H;
					const fw = fh * (img.width / img.height);
					if (side > 0) ctx.scale(-1, 1);
					ctx.drawImage(img, -CLIMBER_GRIP * fw, -16 * s, fw, fh);
					ctx.restore();
					return;
				}
				ctx.fillStyle = "#080a16";
				ctx.strokeStyle = "#080a16";
				ctx.lineCap = "round";
				ctx.lineJoin = "round";
				ctx.beginPath();
				ctx.arc(dx, -9.5 * s, 4.4 * s, 0, TAU);
				ctx.fill();
				ctx.beginPath();
				ctx.moveTo(dx - 3.4 * s, -5.4 * s);
				ctx.lineTo(dx + 3.4 * s, -5.4 * s);
				ctx.lineTo(dx + 2.5 * s, 6 * s);
				ctx.lineTo(dx - 2.5 * s, 6 * s);
				ctx.closePath();
				ctx.fill();
				ctx.lineWidth = 2.2 * s;
				ctx.beginPath();
				if (side === 0) {
					ctx.moveTo(dx - 2.6 * s, -3.8 * s);
					ctx.lineTo(dx - 1.2 * s, -14 * s);
					ctx.moveTo(dx + 2.6 * s, -3.8 * s);
					ctx.lineTo(dx + 1.2 * s, -14 * s);
				} else {
					ctx.moveTo(dx - side * 2.6 * s, -4 * s);
					ctx.lineTo(0, -16 * s);
					ctx.moveTo(dx + side * 2.2 * s, -4 * s);
					ctx.lineTo(0, -9 * s);
				}
				ctx.stroke();
				ctx.lineWidth = 2.4 * s;
				ctx.beginPath();
				ctx.moveTo(dx - 1.9 * s, 5.6 * s);
				ctx.lineTo(dx - side * 1.2 * s - 2.4 * s, 14 * s);
				ctx.moveTo(dx + 1.9 * s, 5.6 * s);
				ctx.lineTo(dx - side * 1.2 * s + 2.6 * s, 13 * s);
				ctx.stroke();
				ctx.restore();
			}


			// The whole scene is smooth gradients, which is what makes it read as
			// screen rather than print. One tile of noise laid over everything puts
			// the paper back. Built once; it never needs to change with the size.
			let grain = null;

			function makeGrain() {
				const tile = document.createElement("canvas");
				tile.width = tile.height = 128;
				const tx = tile.getContext("2d");
				const img = tx.createImageData(128, 128);
				for (let i = 0; i < img.data.length; i += 4) {
					const v = 128 + (Math.random() - 0.5) * 150;
					img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
					img.data[i + 3] = 255;
				}
				tx.putImageData(img, 0, 0);

				// Hanji is fibre, not sand: strands of it lie over the noise. Each one is
				// drawn a second time a tile to the left so it survives the seam.
				tx.lineWidth = 1;
				for (let i = 0; i < 220; i++) {
					const x = Math.random() * 128;
					const y = Math.random() * 128;
					const len = 6 + Math.random() * 34;
					tx.strokeStyle =
						Math.random() < 0.5 ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.16)";
					tx.beginPath();
					tx.moveTo(x, y);
					tx.lineTo(x + len, y);
					tx.moveTo(x - 128, y);
					tx.lineTo(x - 128 + len, y);
					tx.stroke();
				}

				grain = ctx.createPattern(tile, "repeat");
			}

			function drawGrain() {
				if (!grain) return;
				ctx.save();
				ctx.globalCompositeOperation = "overlay";
				ctx.globalAlpha = GRAIN_ALPHA;
				ctx.fillStyle = grain;
				ctx.fillRect(0, 0, w, h);
				ctx.restore();
			}

			// `dawn` (0-1) lifts the vignette as daybreak arrives; a scene with no
			// dawn passes nothing.
			function drawVignette(dawn = 0) {
				const g = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.35, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
				g.addColorStop(0, "rgba(0,0,0,0)");
				g.addColorStop(1, "rgba(0,0,0," + (0.42 - 0.2 * dawn).toFixed(3) + ")");
				ctx.fillStyle = g;
				ctx.fillRect(0, 0, w, h);
			}

			// ── Scenes ──────────────────────────────────────────────────────────
			// Everything above is shared. A scene owns its own state, update, drawing
			// and input; it is entered once and then driven by frame().

			const sceneRopes = (() => {
				const SCROLL = 3600;
				const RATE = 1 / 6; // seconds of holding for a full climb
				const BEATS = 1.7; // hand-over-hand grips per second
				const PULSE_MEAN = 0.788; // keeps the grip rhythm from slowing the average climb
				const PRAY_RATE = 1 / 2.6; // seconds of holding to bring the ropes down
				const CAP = {
					prayer: ["They asked the sky, and the sky let down two ropes.", "하늘이 동아줄을 내렸다"],
					climb: ["Two ropes come down. Only one of them holds.", "해와 달이 된 오누이"],
					sunmoon: ["The children became the sun and the moon.", "오누이는 해와 달이 되었다"],
					fall: ["The rope gave way, and the field closed over.", "수수밭이 술렁였다"],
				};

				let phase = "prayer"; // prayer → climb → rise | fall → end
				let prayer = 0; // 0-1, how far the sky has been asked
				let lastX = -1; // where the hand was when the ropes arrived
				let ending = null;
				let climb = 0;
				let grab = -1;
				let holding = false;
				let beat = 0;
				let lastBeat = 0;
				let mount = 0; // 0 on the ground, 1 hanging on a rope
				let swing = 0;
				let riseT = 0;
				let endT = 0;
				let fallV = 0;
				let fallFrom = 1;
				let flash = 0;
				let impact = null;

				const ropes = [];
				const fibers = [];
				const stars = [];
				const stalks = [];
				const mists = [];

				function seed() {
					stars.length = 0;
					for (let i = 0; i < 220; i++) {
						stars.push({
							x: Math.random(),
							c: Math.random() * 1.6,
							p: 0.35 + Math.random() * 0.75,
							r: 0.45 + Math.pow(Math.random(), 1.8) * 2,
							tw: Math.random() * TAU,
							rgb: starColour(Math.random()),
						});
					}
					mists.length = 0;
					for (let i = 0; i < 10; i++) {
						mists.push({
							x: Math.random(),
							c: Math.random() * 1.6,
							p: 0.5 + Math.random() * 0.5,
							sw: 0.45 + Math.random() * 0.5,
							sh: 0.09 + Math.random() * 0.09,
							o: (0.022 + Math.random() * 0.03) * MIST_STRENGTH,
						});
					}
					stalks.length = 0;
					for (let i = 0; i < 120; i++) {
						stalks.push({
							x: Math.random(),
							hgt: 0.05 + Math.random() * 0.09,
							lean: (Math.random() - 0.5) * 0.55,
							head: 2 + Math.random() * 2.4,
							kind: Math.floor(Math.random() * 4),
							bow: 0,
							hit: false,
						});
					}
				}

				function setCaption(key) {
					elEn.textContent = CAP[key][0];
					elKo.textContent = CAP[key][1];
				}

				function showEnd(key) {
					elEndKo.textContent = CAP[key][1];
					elEndEn.textContent = CAP[key][0];
					elCap.style.opacity = "0";
					elEnd.style.opacity = "1";
				}

				function reset() {
					phase = "prayer";
					prayer = 0;
					lastX = -1;
					ending = null;
					climb = 0;
					grab = -1;
					holding = false;
					beat = 0;
					lastBeat = 0;
					mount = 0;
					swing = 0;
					riseT = 0;
					endT = 0;
					fallV = 0;
					flash = 0;
					impact = null;
					fibers.length = 0;
					ropes.length = 0;
					const bad = Math.random() < 0.5 ? 0 : 1;
					for (let i = 0; i < 2; i++) {
						ropes.push({
							rotten: i === bad,
							breakAt: 0.45 + Math.random() * 0.4,
							seed: Math.random() * 1000,
							strain: 0,
							stretch: 0,
							snapped: false,
							snapAt: 0,
						});
					}
					for (const s of stalks) {
						s.bow = 0;
						s.hit = false;
					}
					elTitle.style.opacity = "0"; // the card belongs to the opening scene
					elCap.style.opacity = "1";
					elEn.style.opacity = "1";
					elKo.style.opacity = "1";
					elEnd.style.opacity = "0";
					elAgain.style.opacity = "0";
					elHint.textContent = "화면을 누르고 있으세요";
					setCaption("prayer");
				}

				const climbY = () => h * 0.58;
				const fieldTop = () => h * 0.8 + climb * SCROLL * 0.3;
				const lightY = () => h * 0.3 + (climb - 1) * SCROLL * 0.6;
				const ropeBaseX = (i) => w * 0.5 + (i ? 1 : -1) * Math.min(w * 0.15, 86);

				function ropeX(i, y) {
					const r = ropes[i];
					const amp = grab === i && holding ? 3 : 9;
					const scroll = y + climb * SCROLL + r.seed;
					return (
						ropeBaseX(i) +
						Math.sin(scroll * 0.0055 + t * 0.7) * amp +
						Math.sin(scroll * 0.017) * 2 +
						(grab === i ? swing : 0)
					);
				}

				// Rot only shows on a rope you have actually pulled on.
				function decayOf(r) {
					if (!r.rotten) return 0;
					return clamp01((r.strain - 0.22) / Math.max(0.05, r.breakAt - 0.22));
				}

				function nearestRope(px, py) {
					let best = -1;
					let bestD = Math.max(58, w * 0.17);
					for (let i = 0; i < 2; i++) {
						const d = Math.abs(ropeX(i, py) - px);
						if (d < bestD) {
							bestD = d;
							best = i;
						}
					}
					return best;
				}

				function chooseRope(i) {
					if (i < 0) return;
					if (phase !== "climb") return;
					if (grab !== -1 && grab !== i) {
						climb = Math.max(0, climb - 0.035);
						swing = i ? -16 : 16;
					}
					grab = i;
				}

				function spawnFiber(x, y, burst) {
					fibers.push({
						x: x + (Math.random() - 0.5) * 9,
						y: y + (Math.random() - 0.5) * 26,
						vx: (Math.random() - 0.5) * (burst ? 150 : 26),
						vy: (burst ? -60 : 10) + Math.random() * 40,
						rot: Math.random() * TAU,
						vr: (Math.random() - 0.5) * 6,
						len: 3 + Math.random() * (burst ? 9 : 5),
						life: 1,
					});
				}

				function climbStep(dt) {
					if (grab < 0 || phase !== "climb") return;
					const r = ropes[grab];
					const decay = decayOf(r);
					// A rotten rope gives under the weight: every grip wins a little less.
					const gain = r.rotten ? 0.88 - 0.22 * decay : 1;
					beat += dt * BEATS;
					const pulse = (0.5 + 0.85 * Math.pow(Math.max(0, Math.sin(beat * TAU)), 0.7)) / PULSE_MEAN;
					climb += RATE * gain * pulse * dt;
					r.strain = Math.max(r.strain, climb);
					if (Math.floor(beat) !== lastBeat) {
						lastBeat = Math.floor(beat);
						r.stretch = Math.min(1, r.stretch + (r.rotten ? 0.95 : 0.55));
						const n = decay > 0.05 ? 1 + Math.floor(decay * 3) : 0;
						for (let i = 0; i < n; i++) spawnFiber(ropeX(grab, climbY() - 40), climbY() - 40, false);
					}
					if (r.rotten && climb >= r.breakAt) return snap();
					if (climb >= 1) {
						climb = 1;
						phase = "rise";
						riseT = 0;
						holding = false;
					}
				}

				function snap() {
					const r = ropes[grab];
					r.snapped = true;
					r.snapAt = climb;
					phase = "fall";
					fallFrom = climb;
					fallV = 0.04;
					flash = 0.3;
					holding = false;
					for (let i = 0; i < 26; i++) spawnFiber(ropeX(grab, climbY() - 26), climbY() - 26, true);
				}

				function onDown(e) {
					e.preventDefault();
					if (phase === "end") {
						if (endT > 1) goTo(sceneGate, 0.9);
						return;
					}
					if (phase === "prayer") {
						lastX = pos(e).x;
						holding = true;
						return;
					}
					if (phase !== "climb") return;
					const p = pos(e);
					const i = nearestRope(p.x, p.y);
					if (i < 0) return;
					chooseRope(i);
					holding = true;
				}

				function onUp() {
					holding = false;
				}

				function onKey(e) {
					if (phase === "end") {
						if (endT > 1) goTo(sceneGate, 0.9);
						return;
					}
					if (phase === "prayer") {
						if (e.key === "ArrowLeft") lastX = 0;
						else if (e.key === "ArrowRight") lastX = w;
						else if (e.key !== "ArrowDown" && e.key !== " " && e.key !== "Enter") return;
						holding = true;
						e.preventDefault();
						return;
					}
					if (e.key === "ArrowLeft") chooseRope(0);
					else if (e.key === "ArrowRight") chooseRope(1);
					else if (e.key === "ArrowDown" || e.key === " " || e.key === "Enter") {
						if (grab < 0) chooseRope(0);
						holding = true;
					} else return;
					e.preventDefault();
				}

				function onKeyUp(e) {
					if (e.key === "ArrowDown" || e.key === " " || e.key === "Enter") holding = false;
				}

				// Daybreak arrives from the top, where the two lights are; night lingers below.
				function dawnAmount() {
					return phase === "rise" || ending === "sunmoon" ? clamp01((riseT - 0.5) / 1.6) : 0;
				}

				function drawSky() {
					const lift = Math.max(clamp01((climb - 0.55) / 0.45), prayer * 0.55);
					const dawn = dawnAmount();
					const top = mixArr(mixArr([16, 19, 43], [58, 42, 98], lift * 0.55), [214, 142, 96], dawn);
					const midY = mixArr([19, 18, 45], [104, 72, 116], dawn);
					const bottom = mixArr([23, 18, 46], [28, 22, 58], dawn);
					const g = ctx.createLinearGradient(0, 0, 0, h);
					g.addColorStop(0, rgb(top, top, 0));
					g.addColorStop(0.45, rgb(midY, midY, 0));
					g.addColorStop(1, rgb(bottom, bottom, 0));
					ctx.fillStyle = g;
					ctx.fillRect(0, 0, w, h);
				}

				function drawStars() {
					for (const s of stars) {
						let y = h * 0.5 + (climb - s.c) * SCROLL * s.p;
						if (y > h + 30) {
							s.c += 1.6;
							y = h * 0.5 + (climb - s.c) * SCROLL * s.p;
						} else if (y < -30) {
							s.c -= 1.6;
							y = h * 0.5 + (climb - s.c) * SCROLL * s.p;
						}
						if (y < -10 || y > h + 10) continue;
						const a = (0.3 + 0.65 * s.p) * (0.6 + 0.4 * Math.sin(t * 1.6 + s.tw));
						ctx.fillStyle = s.rgb + a.toFixed(3) + ")";
						ctx.beginPath();
						ctx.arc(s.x * w, y, s.r * s.p, 0, TAU);
						ctx.fill();
					}
				}

				function drawMist() {
					for (const m of mists) {
						let y = h * 0.5 + (climb - m.c) * SCROLL * m.p;
						if (y > h + 400) {
							m.c += 1.6;
							y = h * 0.5 + (climb - m.c) * SCROLL * m.p;
						} else if (y < -400) {
							m.c -= 1.6;
							y = h * 0.5 + (climb - m.c) * SCROLL * m.p;
						}
						const rx = w * m.sw;
						const ry = h * m.sh;
						if (y < -ry * 3 || y > h + ry * 3) continue;
						ctx.save();
						ctx.translate(m.x * w, y);
						ctx.scale(1, ry / rx);
						const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
						g.addColorStop(0, "rgba(104,100,150," + m.o.toFixed(3) + ")");
						g.addColorStop(1, "rgba(104,100,150,0)");
						ctx.fillStyle = g;
						ctx.beginPath();
						ctx.arc(0, 0, rx, 0, TAU);
						ctx.fill();
						ctx.restore();
					}
				}

				// The ground keeps glowing under you for a while after it drops away.
				function drawHorizon() {
					const k = 1 - clamp01(climb / 0.4);
					if (k <= 0) return;
					const g = ctx.createRadialGradient(w * 0.5, h * 1.02, 0, w * 0.5, h * 1.02, h * 0.62);
					g.addColorStop(0, "rgba(206,140,92," + (0.26 * k).toFixed(3) + ")");
					g.addColorStop(1, "rgba(206,140,92,0)");
					ctx.fillStyle = g;
					ctx.fillRect(0, 0, w, h);
				}

				function drawLight() {
					const y = lightY();
					const rad = Math.max(w, h) * 0.95;
					if (y < -rad || y > h + rad) return;
					const g = ctx.createRadialGradient(w * 0.5, y, 0, w * 0.5, y, rad);
					g.addColorStop(0, "rgba(255,233,176,0.92)");
					g.addColorStop(0.14, "rgba(255,214,138,0.42)");
					g.addColorStop(0.45, "rgba(255,201,120,0.12)");
					g.addColorStop(1, "rgba(255,201,120,0)");
					ctx.fillStyle = g;
					ctx.fillRect(0, 0, w, h);
				}

				function drawField() {
					const top = fieldTop();
					if (top > h + 4) return;
					const s = scale();

					ctx.fillStyle = "#1b1524";
					ctx.fillRect(0, top, w, h - top + 2);

					for (const st of stalks) {
						const x = st.x * w;
						const hh = st.hgt * h * (1 - st.bow * 0.45);
						const sway = Math.sin(t * 0.9 + st.x * 12) * 3;
						// the wave from the landing shoves each stalk away, then it rights itself
						const push = impact ? Math.sign(x - impact.x) * st.bow * 26 : 0;
						const tipX = x + st.lean * 22 + sway + push;

						const blade = art["stalk" + st.kind];
						if (blade) {
							// A drawing cannot bend, so the stalk leans from its root by the angle
							// the tip would have reached. Sway, lean and the landing shove all
							// still come through, because they only feed this one rotation.
							ctx.save();
							ctx.translate(x, top + 6);
							ctx.rotate(Math.atan2(tipX - x, hh));
							const bw = hh * (blade.width / blade.height);
							ctx.drawImage(blade, -bw / 2, -hh, bw, hh);
							ctx.restore();
							continue;
						}

						ctx.strokeStyle = "#2a1f2e";
						ctx.lineWidth = 1.6 * s;
						ctx.beginPath();
						ctx.moveTo(x, top + 6);
						ctx.quadraticCurveTo(x + st.lean * 14 + sway + push * 0.45, top - hh * 0.5, tipX, top - hh);
						ctx.stroke();
						ctx.fillStyle = "#302234";
						ctx.beginPath();
						ctx.ellipse(tipX, top - hh, st.head * 0.7 * s, st.head * 1.5 * s, st.lean * 0.4 + st.bow * 0.5, 0, TAU);
						ctx.fill();
					}
				}

				// A rope is a cylinder, not a line: rim, body, shaded side and lit side are
				// four strokes over one centreline, and the twist is drawn as grooves that
				// bow the way they would wrap around it.
				function strokeAlong(pts, dx) {
					ctx.beginPath();
					ctx.moveTo(pts[0] + dx, pts[1]);
					for (let k = 2; k < pts.length; k += 2) ctx.lineTo(pts[k] + dx, pts[k + 1]);
					ctx.stroke();
				}

				function drawRope(i) {
					const r = ropes[i];
					const s = scale();
					const decay = decayOf(r);
					const fade = phase === "rise" ? 1 - clamp01(riseT / 1.1) : 1;
					if (fade <= 0) return;

					let bottom = Math.min(h + 20, fieldTop() - 12);
					if (phase === "prayer") bottom = Math.min(bottom, mix(-30, climbY() + 14, prayer));
					if (r.snapped) bottom = Math.min(bottom, climbY() + (climb - r.snapAt) * SCROLL);
					if (bottom < -20) return;

					// One pass over the centreline; every layer below reuses these points.
					const pts = [];
					for (let y = -24; y <= bottom; y += 6) pts.push(ropeX(i, y), y);
					pts.push(ropeX(i, bottom), bottom);

					const unit = s * 0.62;
					const W = (7 - decay * 1.8) * unit;
					const hw = W * 0.5;
					const body = decay ? rgb([216, 192, 138], [132, 110, 74], decay) : "rgb(216,192,138)";
					const lit = decay ? rgb([245, 227, 178], [168, 144, 100], decay) : "rgb(245,227,178)";
					const shade = decay ? rgb([138, 112, 66], [86, 70, 44], decay) : "rgb(138,112,66)";

					ctx.globalAlpha = fade;
					ctx.lineCap = "round";
					ctx.lineJoin = "round";

					// rim — separates the rope from the sky behind it
					ctx.strokeStyle = "rgba(32,24,14,0.5)";
					ctx.lineWidth = W * 1.2;
					strokeAlong(pts, 0);

					ctx.strokeStyle = body;
					ctx.lineWidth = W;
					strokeAlong(pts, 0);

					// the light in this scene comes from above and slightly left
					ctx.globalAlpha = fade * 0.5;
					ctx.strokeStyle = shade;
					ctx.lineWidth = W * 0.4;
					strokeAlong(pts, hw * 0.58);

					ctx.globalAlpha = fade * 0.55;
					ctx.strokeStyle = lit;
					ctx.lineWidth = W * 0.28;
					strokeAlong(pts, -hw * 0.6);
					ctx.globalAlpha = fade;

					// twist — grooves between the three strands, scrolling with the climb
					const step = W * 1.25;
					const off = ((climb * SCROLL) % step) - step;
					ctx.lineWidth = Math.max(0.8, W * 0.13);
					for (let pass = 0; pass < 2; pass++) {
						// pass 0 is the groove itself, pass 1 the lit edge of the strand above it
						ctx.strokeStyle = pass ? lit : "rgba(58,42,26,0.55)";
						ctx.globalAlpha = fade * (pass ? 0.34 : 0.85 - decay * 0.3);
						const shift = pass ? -W * 0.16 : 0;
						ctx.beginPath();
						for (let y = off - 24; y <= bottom; y += step) {
							if (y < -30) continue;
							const x = ropeX(i, y) + shift;
							ctx.moveTo(x - hw * 0.92, y + hw * 0.66);
							ctx.quadraticCurveTo(x, y + hw * 0.08, x + hw * 0.92, y - hw * 0.66);
						}
						ctx.stroke();
					}
					ctx.globalAlpha = fade;

					// rot pushes single fibres out of the lay
					if (decay > 0.25) {
						ctx.strokeStyle = "rgba(150,126,84," + (decay * 0.8).toFixed(2) + ")";
						ctx.lineWidth = Math.max(0.7, W * 0.1);
						ctx.beginPath();
						const hair = step * 2.4;
						const hoff = ((climb * SCROLL * 0.5 + r.seed) % hair) - hair;
						for (let y = hoff - 24, n = 0; y <= bottom; y += hair, n++) {
							if (y < -30) continue;
							const x = ropeX(i, y);
							const dir = n % 2 ? 1 : -1;
							ctx.moveTo(x + dir * hw * 0.6, y);
							ctx.quadraticCurveTo(
								x + dir * hw * 1.9,
								y - hw * 0.5,
								x + dir * hw * (2 + decay * 1.6),
								y + hw * 0.7,
							);
						}
						ctx.stroke();
					}

					// frayed end
					if (bottom < h + 18) {
						const x = ropeX(i, bottom);
						ctx.strokeStyle = body;
						ctx.lineWidth = Math.max(0.8, W * 0.16);
						ctx.beginPath();
						for (let k = -3; k <= 3; k++) {
							const spread = k * hw * 0.5;
							ctx.moveTo(x + spread * 0.25, bottom - hw * 0.5);
							ctx.quadraticCurveTo(
								x + spread * 0.8,
								bottom + hw * 0.9,
								x + spread,
								bottom + hw * (1.8 + Math.abs(k) * 0.5),
							);
						}
						ctx.stroke();
					}
					ctx.globalAlpha = 1;
				}

				// x is the rope itself; the body hangs beside it so the silhouette stays readable.
				function drawClimber() {
					if (phase === "end" || phase === "prayer") return; // the field has closed over, or the sky has taken them
					const s = scale();
					if (phase === "rise") {
						const k = clamp01(riseT / 1);
						const y = mix(climbY(), lightY(), k * k);
						if (riseT < 1.05) figure(ropeX(grab < 0 ? 0 : grab, y), y, s * (1 - k * 0.35), 0, 0);
						return;
					}
					const groundY = fieldTop() - 14 * s;
					const onRope = grab >= 0;
					const ry = climbY() + (onRope ? ropes[grab].stretch * 7 * s : 0);
					const x = onRope ? ropeX(grab, ry) : w * 0.5;
					// falling, the climber also drops out of the camera and into the field
					const y =
						phase === "fall"
							? mix(climbY(), fieldTop() - 12 * s, 1 - clamp01(climb / Math.max(0.001, fallFrom)))
							: mix(groundY, ry, mount);
					const rot = phase === "fall" ? Math.sin(t * 7) * 0.5 + fallV * 1.2 : 0;
					const side = phase === "fall" || !onRope ? 0 : grab === 0 ? 1 : -1;
					figure(x, y, s, rot, side);
				}


				// Hand over hand: the pull is the positive half of the beat that drives
				// climb, so the tucked pose lands exactly on it and the long one between.
				function climberPose() {
					const pulling =
						phase === "climb" && holding && grab >= 0 && Math.sin(beat * TAU) > 0;
					return (pulling ? art.climberUp : art.climberHang) || art.climberHang || art.climberUp;
				}

				// The branch they wait on and the two of them on it. Assets if they
				// arrived; otherwise the shapes this piece was built from, so the phase
				// works before the drawings do.
				const branchY = () => h * 0.62;
				// Measured off the drawings: where the bark's upper surface sits inside
				// the branch art, and where the pair's weight falls across theirs.
				const BRANCH_TOP = 0.489;
				const BRANCH_SEAT = 0.7; // along its length, the stretch they sit on
				const SIB_CX = 0.472;

				function drawBranch() {
					const s = scale();
					const by = branchY();
					const tip = w * 0.62;
					const img = art.branch;
					if (img) {
						const bh = h * 0.26;
						const bw = bh * (img.width / img.height);
						// line the bark's surface up with the seat line, not the art's edge
						ctx.drawImage(img, w * 0.5 - BRANCH_SEAT * bw, by - BRANCH_TOP * bh, bw, bh);
						return;
					}
					ctx.fillStyle = "#0e0b16";
					ctx.beginPath();
					ctx.moveTo(-10, by - 9 * s);
					ctx.quadraticCurveTo(w * 0.3, by - 5 * s, tip, by - 1.6 * s);
					ctx.lineTo(tip, by + 1.6 * s);
					ctx.quadraticCurveTo(w * 0.3, by + 6 * s, -10, by + 11 * s);
					ctx.closePath();
					ctx.fill();
				}

				function drawSiblings() {
					const s = scale();
					const by = branchY();
					const img = art.siblings;
					if (img) {
						const sh = 48 * s;
						const sw = sh * (img.width / img.height);
						// their seat is the bottom edge of the art, so it lands on the bark
						ctx.drawImage(img, w * 0.5 - SIB_CX * sw, by - sh, sw, sh);
						return;
					}
					drawFigure(null, w * 0.5 - 7 * s, by - 13 * s, s * 0.92, 0, 0, "grip");
					drawFigure(null, w * 0.5 + 6 * s, by - 11 * s, s * 0.76, 0, 0, "grip");
				}

				function drawSunMoon() {
					if (ending !== "sunmoon" && phase !== "rise") return;
					const k = clamp01((riseT - 1) / 1.3);
					if (k <= 0) return;
					const s = Math.min(w, h);
					const y = mix(lightY(), h * 0.3, k);
					const gap = mix(0, Math.min(w * 0.26, 170), k);
					const rad = s * 0.075 * k;
					const pairs = [
						["sun", w * 0.5 - gap, "#ffc93c", "rgba(255,201,60,0.35)"],
						["moon", w * 0.5 + gap, "#f2efe4", "rgba(242,239,228,0.3)"],
					];
					for (const [name, x, core, halo] of pairs) {
						const g = ctx.createRadialGradient(x, y, rad * 0.6, x, y, rad * 4.5);
						g.addColorStop(0, halo);
						g.addColorStop(1, "rgba(255,201,120,0)");
						ctx.fillStyle = g;
						ctx.beginPath();
						ctx.arc(x, y, rad * 4.5, 0, TAU);
						ctx.fill();
						const img = art[name];
						if (img) {
							ctx.drawImage(img, x - rad, y - rad, rad * 2, rad * 2);
						} else {
							ctx.fillStyle = core;
							ctx.beginPath();
							ctx.arc(x, y, rad, 0, TAU);
							ctx.fill();
						}
					}
				}

				function drawFibers() {
					ctx.strokeStyle = "rgba(198,172,118,0.75)";
					ctx.lineWidth = 1.2 * scale() * 0.7;
					ctx.beginPath();
					for (const f of fibers) {
						ctx.globalAlpha = clamp01(f.life);
						ctx.moveTo(f.x, f.y);
						ctx.lineTo(f.x + Math.cos(f.rot) * f.len, f.y + Math.sin(f.rot) * f.len);
					}
					ctx.stroke();
					ctx.globalAlpha = 1;
				}

				function update(dt) {
					swing *= Math.pow(0.0015, dt);
					for (const r of ropes) r.stretch *= Math.pow(0.02, dt);
					flash = Math.max(0, flash - dt * 1.4);

					if (grab >= 0) mount = Math.min(1, mount + dt * 9);

					const before = climb;

					if (phase === "prayer") {
						prayer = clamp01(prayer + (holding ? dt * PRAY_RATE : -dt * PRAY_RATE * 0.7));
						if (prayer >= 1) {
							phase = "climb";
							setCaption("climb");
							elHint.textContent = "";
							// Still holding when they arrive? Then the hand that brought them
							// down is already on one, and which one is whatever it was
							// nearest — you do not get to know which rope is the rotten one.
							if (holding) {
								chooseRope(lastX < 0 ? 0 : Math.max(0, nearestRope(lastX, climbY())));
								// No climbing up from the field: the hand that brought the rope
								// down is already on it.
								mount = 1;
							}
						}
					}

					if (phase === "climb") {
						if (holding) climbStep(dt);
						else climb = Math.max(0, climb - dt * 0.016);
					}

					if (phase === "rise") {
						riseT += dt;
						if (riseT > 1.4 && ending !== "sunmoon") {
							ending = "sunmoon";
						}
						if (riseT > 2.8 && phase === "rise") {
							phase = "end";
							endT = 0;
							showEnd("sunmoon");
						}
					}

					if (phase === "fall") {
						fallV = Math.min(0.8, fallV + dt * 0.55);
						climb -= fallV * dt;
						if (climb <= 0) {
							climb = 0;
							impact = { x: ropeX(grab < 0 ? 0 : grab, climbY()), r: 0 };
							ending = "fall";
							showEnd("fall");
							phase = "end";
							endT = 0;
							for (let i = 0; i < 16; i++) spawnFiber(impact.x, fieldTop() - 10, true);
							grab = -1;
						}
					}

					if (phase === "end") {
						endT += dt;
						if (ending === "sunmoon") riseT += dt;
						if (impact) impact.r = Math.min(w * 1.4, impact.r + dt * 520);
						if (endT > 1.2) elAgain.style.opacity = "1";
					}

					if (impact) {
						for (const st of stalks) {
							if (!st.hit && Math.abs(st.x * w - impact.x) < impact.r) {
								st.hit = true;
								st.bow = 1;
							}
							if (st.bow > 0) st.bow = Math.max(0, st.bow - dt * 0.9);
						}
					}

					const scrolled = (before - climb) * SCROLL;
					for (let i = fibers.length - 1; i >= 0; i--) {
						const f = fibers[i];
						f.vy += 240 * dt;
						f.x += f.vx * dt;
						f.y += f.vy * dt + scrolled;
						f.rot += f.vr * dt;
						f.life -= dt * 0.85;
						if (f.life <= 0 || f.y > h + 40) fibers.splice(i, 1);
					}
				}

				function figure(x, y, s, rot, side) {
					if (phase === "fall" && art.climberFall) {
						drawFigure(art.climberFall, x, y, s, rot, side, "mass");
						return;
					}
					drawFigure(climberPose(), x, y, s, rot, side, "grip");
				}

				function enter() {
					seed();
					reset();
				}

				function draw() {
					drawSky();
					drawStars();
					drawMist();
					drawHorizon();
					drawLight();
					drawField();
					if (phase === "prayer") {
						drawBranch();
						drawSiblings();
					}
					if (phase !== "end" || ending === "fall") {
						for (let i = 0; i < ropes.length; i++) drawRope(i);
					}
					drawFibers();
					drawClimber();
					if (phase === "end") {
						const dim = clamp01(endT / 0.8) * (ending === "sunmoon" ? 0.34 : 0.6);
						ctx.fillStyle = "rgba(8,10,22," + dim.toFixed(3) + ")";
						ctx.fillRect(0, 0, w, h);
					}
					drawSunMoon();
					drawGrain();
					drawVignette(dawnAmount());
					if (flash > 0) {
						ctx.fillStyle = "rgba(255,240,210," + (flash * 0.5).toFixed(3) + ")";
						ctx.fillRect(0, 0, w, h);
					}
				}

				return { name: "ropes", enter, update, draw, down: onDown, up: onUp, key: onKey, keyUp: onKeyUp };
			})();

			// ── Scene 1 · the pass ──────────────────────────────────────────────
			// She walks the ridges with rice cakes on her head and a tiger behind
			// her. A tap hands one over and buys a hill. The cakes run out either
			// way — the dread rises on its own clock, so hurrying and stalling end
			// in the same place. That is the tale, not a difficulty setting.
			const sceneGate = (() => {
				const RICE_START = 3;
				const MENACE_RATE = 1 / 5; // seconds of doing nothing to fill it
				const TAP_RELIEF = 0.35;
				const DEMAND_AT = 0.55; // where the tiger stops following and asks
				const THROW_TIME = 1.05; // seconds a cake spends in the air
				const WALK = 26; // px/s the world drifts past while she walks
				const GRAVITY = 940;
				const MOTHER_H = 52; // × scale(); the children are 30
				const MOTHER_RIM_Y = 0.0254; // basket rim, measured off the artwork
				const MOTHER_RIM_X = 0.4957;
				const MOTHER_RIM_W = 0.7652;
				const LAYER_SPEED = [0.07, 0.15, 0.31, 0.62];
				const LAYER_H = [0.3, 0.34, 0.4, 0.5];
				const CAP_GATE = [
					"Give me a rice cake and I will not eat you.",
					"떡 하나 주면 안 잡아먹지",
				];

				let menace = 0;
				let rice = RICE_START;
				let travel = 0;
				let surge = 0;
				let stride = 0;
				let blinkT = 2;
				let demanding = false;
				let flare = 0;
				let taught = false;
				let taken = 0; // >0 once she is caught: the eyes swell and we cut
				let started = false;
				const cakes = [];
				const sky = [];

				// The ridges are backdrop and sit low; she walks the crest line above
				// them, so a black silhouette always has sky behind it rather than
				// more black.
				// The near ridge's skyline, sampled off the artwork at build time. The
				// chapter runs without allow-same-origin, so an image drawn to a canvas
				// taints it and getImageData throws — the shape cannot be read here.
				const CREST = [
					0.458, 0.467, 0.492, 0.469, 0.45, 0.461, 0.461, 0.447, 0.45, 0.464, 0.489, 0.497,
					0.519, 0.592, 0.636, 0.614, 0.658, 0.7, 0.664, 0.622, 0.625, 0.603, 0.581, 0.572,
					0.575, 0.583, 0.622, 0.619, 0.622, 0.661, 0.733, 0.758, 0.739, 0.711, 0.697, 0.686,
					0.708, 0.769, 0.789, 0.786, 0.742, 0.725, 0.742, 0.722, 0.7, 0.692, 0.756, 0.775,
					0.794, 0.744, 0.783, 0.778, 0.778, 0.753, 0.764, 0.647, 0.6, 0.586, 0.611, 0.603,
					0.656, 0.65, 0.628, 0.664, 0.617, 0.631, 0.569, 0.569, 0.514, 0.556, 0.558, 0.458,
					0.433, 0.433, 0.419, 0.392, 0.378, 0.389, 0.403, 0.408, 0.497, 0.517, 0.517, 0.553,
					0.528, 0.492, 0.544, 0.558, 0.442, 0.389, 0.375, 0.372, 0.386, 0.386, 0.397, 0.419,
				];

				function layerGeom(i) {
					const img = art["ridge" + i];
					const lh = h * LAYER_H[i];
					const lw = img ? lh * (img.width / img.height) : h * 1.5;
					const span = lw * 2;
					return { img, lh, lw, span, x0: -((((travel * LAYER_SPEED[i]) % span) + span) % span) };
				}

				// Ground under a given screen x. Each layer is tiled against its own
				// mirror, so the second half of every span reads backwards.
				function crestY(x) {
					const g = layerGeom(3);
					if (!g.img) return h * 0.76;
					const u = (((x - g.x0) % g.span) + g.span) % g.span;
					const uu = u < g.lw ? u / g.lw : 1 - (u - g.lw) / g.lw;
					const f = uu * (CREST.length - 1);
					const i0 = Math.floor(f);
					const i1 = Math.min(CREST.length - 1, i0 + 1);
					return groundY() - g.lh + mix(CREST[i0], CREST[i1], f - i0) * g.lh;
				}

				const tigerX = () => mix(w * 0.04, w * 0.38, menace);
				// It comes in a straight line rather than tracking the hills — a pair of
				// eyes gliding level reads as something stalking, not something walking.
				const tigerY = () => h * 0.78;
				// The layers are solid below their ridgeline, so their base belongs at the
				// very bottom of the frame. Anything less leaves a band of bare sky
				// under the hills — invisible on a tall window, obvious on a wide one.
				const groundY = () => h;
				// Standing on a single sampled point perches her on whatever spike is
				// under that pixel, with the ground falling away either side. She takes
				// the lowest crest across her own width instead, and sinks a little into
				// it, so the ridge drawn over her always covers her feet.
				const MOTHER_X = 0.7;

				function walkY() {
					const mw = MOTHER_H * scale() * motherAspect();
					let low = -Infinity;
					for (let i = 0; i <= 4; i++) {
						low = Math.max(low, crestY(w * MOTHER_X + (i / 4 - 0.5) * mw));
					}
					return low + h * 0.035;
				}

				function enter() {
					menace = 0;
					rice = RICE_START;
					travel = 0;
					surge = 0;
					stride = 0;
					taken = 0;
					started = false;
					cakes.length = 0;
					sky.length = 0;
					for (let i = 0; i < 150; i++) {
						sky.push({
							x: Math.random(),
							y: Math.random() * 0.66,
							r: 0.45 + Math.pow(Math.random(), 1.8) * 1.9,
							tw: Math.random() * TAU,
							rgb: starColour(Math.random()),
						});
					}
					elTitle.style.opacity = "1";
					elCap.style.opacity = "1";
					elEnd.style.opacity = "0";
					elAgain.style.opacity = "0";
					elEn.textContent = CAP_GATE[0];
					elKo.textContent = CAP_GATE[1];
					// The hint has to stay legible while the tiger's line is still
					// unsaid, so only the two spoken lines fade — not the whole block.
					elCap.style.opacity = "1";
					elEn.style.opacity = "0";
					elKo.style.opacity = "0";
					elHint.textContent = "화면을 누르면 시작합니다";
					demanding = false;
					flare = 0;
					taught = false;
				}

				function give() {
					if (taken) return;
					// The first tap only starts the clock. Arriving mid-chase, before you
					// have read what is on screen, is not a choice you made.
					if (!started) {
						started = true;
						elTitle.style.opacity = "0";
						elHint.textContent = "호랑이가 가까워지면 화면을 누르세요";
						return;
					}
					if (rice <= 0) {
						taken = 0.0001; // nothing left to give
						hush();
						return;
					}
					rice -= 1;
					surge = 1;
					const s = scale();
					const mh = MOTHER_H * s;
					const mw = mh * motherAspect();
					const sx = w * MOTHER_X + mw * (MOTHER_RIM_X - 0.5);
					const sy = walkY() - mh + mh * MOTHER_RIM_Y;
					// Aimed at the tiger rather than thrown away, so the arc ends where
					// the recoil begins and the two read as one thing.
					const T = THROW_TIME;
					cakes.push({
						x: sx,
						y: sy,
						vx: (tigerX() - sx) / T,
						vy: (tigerY() - sy - 0.5 * GRAVITY * T * T) / T,
						rot: Math.random() * TAU,
						vr: (Math.random() - 0.5) * 9,
						r: 3.1 * s,
					});
				}

				function hush() {
					elEn.style.opacity = "0";
					elKo.style.opacity = "0";
					elHint.textContent = "";
				}

				function motherAspect() {
					const m = art.mother;
					return m ? m.width / m.height : 0.449;
				}

				function update(dt) {
					stride += dt * 1.55;
					travel += (WALK + surge * 230) * dt;
					surge = Math.max(0, surge - dt * 1.7);

					blinkT -= dt;
					if (blinkT < -0.12) blinkT = 1.8 + Math.random() * 3.4;

					flare = Math.max(0, flare - dt * 1.6);

					if (!started) return;

					if (!taken) {
						menace = clamp01(menace + dt * MENACE_RATE);
						// It closes in, then stops and asks. The asking is the cue.
						const asking = menace >= DEMAND_AT;
						if (asking !== demanding) {
							demanding = asking;
							elEn.style.opacity = asking ? "1" : "0";
							elKo.style.opacity = asking ? "1" : "0";
							if (asking) {
								flare = 1;
								if (!taught) elTitle.style.opacity = "0";
							}
						}
						if (menace >= 1) {
							taken = 0.0001;
							hush();
						}
					} else {
						taken += dt;
						if (taken > 1.5 && !changing()) goTo(sceneDoor, 0.9);
					}

					for (let i = cakes.length - 1; i >= 0; i--) {
						const c = cakes[i];
						c.vy += GRAVITY * dt;
						c.x += c.vx * dt;
						c.y += c.vy * dt;
						c.rot += c.vr * dt;
						// Reaching the tiger is what buys the hill — not the tap that
						// sent it. Given too early there is nothing to give back, and
						// the cake is simply gone.
						if (c.x <= tigerX()) {
							menace = Math.max(0, menace - TAP_RELIEF);
							flare = 0.6;
							taught = true;
							elHint.textContent = "";
							cakes.splice(i, 1);
							continue;
						}
						if (c.y > h + 30) cakes.splice(i, 1);
					}
				}

				function drawSky() {
					const g = ctx.createLinearGradient(0, 0, 0, h);
					g.addColorStop(0, "rgb(16,19,43)");
					g.addColorStop(0.55, "rgb(21,20,47)");
					g.addColorStop(1, "rgb(31,23,49)");
					ctx.fillStyle = g;
					ctx.fillRect(0, 0, w, h);
				}

				function drawStars() {
					for (const st of sky) {
						const a = 0.3 + 0.5 * (0.6 + 0.4 * Math.sin(t * 1.6 + st.tw));
						ctx.fillStyle = st.rgb + a.toFixed(3) + ")";
						ctx.beginPath();
						ctx.arc(((st.x * w - travel * 0.02) % w + w) % w, st.y * h, st.r, 0, TAU);
						ctx.fill();
					}
				}

				// Each layer is one drawing tiled with its own mirror, so the ridge
				// never shows a seam however far she walks.
				function drawRidge(i) {
					const gy = groundY();
					const { img, lh, lw, span, x0 } = layerGeom(i);
					{
						if (!img) {
							ctx.fillStyle = ["#1e2542", "#18203a", "#121a2f", "#0c1222"][i];
							ctx.beginPath();
							ctx.moveTo(0, gy);
							for (let x = 0; x <= w; x += 24) {
								const u = (x + travel * LAYER_SPEED[i]) * 0.004;
								ctx.lineTo(x, gy - lh * (0.42 + 0.2 * Math.sin(u + i) + 0.1 * Math.sin(u * 2.3)));
							}
							ctx.lineTo(w, gy);
							ctx.closePath();
							ctx.fill();
							return;
						}
						for (let x = x0; x < w; x += span) {
							ctx.drawImage(img, x, gy - lh, lw, lh);
							ctx.save();
							ctx.translate(x + span, gy - lh);
							ctx.scale(-1, 1);
							ctx.drawImage(img, 0, 0, lw, lh);
							ctx.restore();
						}
					}
				}

				// Only ever two eyes. Closing the distance is the whole performance.
				function drawTiger() {
					const s = scale();
					const shut = blinkT < 0 && !taken;
					// It comes for her rather than swallowing the frame: the eyes stay
					// eyes, rush to the middle, and the night closes around them.
					const swell = taken ? clamp01(taken / 1.2) : 0;
					const ease = swell * swell;
					const ex = mix(tigerX(), w * 0.5, ease);
					const ey = mix(tigerY(), h * 0.46, ease);
					const gap = mix(mix(4.6, 9, menace) * s, Math.min(w, h) * 0.15, ease);
					const r =
						mix(mix(2.6, 5.2, menace) * (1 + flare * 0.55) * s, Math.min(w, h) * 0.085, ease) *
						(shut ? 0.14 : 1);

					for (const d of [-1, 1]) {
						const x = ex + d * gap;
						const glow = ctx.createRadialGradient(x, ey, 0, x, ey, r * 7);
						glow.addColorStop(0, "rgba(242,193,78," + (0.32 + flare * 0.3).toFixed(3) + ")");
						glow.addColorStop(1, "rgba(242,193,78,0)");
						ctx.fillStyle = glow;
						ctx.beginPath();
						ctx.arc(x, ey, r * 7, 0, TAU);
						ctx.fill();
						ctx.fillStyle = "#f2c14e";
						ctx.beginPath();
						ctx.ellipse(x, ey, r, r * (shut ? 1 : 1.15), 0, 0, TAU);
						ctx.fill();
					}
				}

				function cake(x, y, r, rot) {
					ctx.save();
					ctx.translate(x, y);
					ctx.rotate(rot);
					ctx.fillStyle = "#efe3c4";
					ctx.beginPath();
					ctx.ellipse(0, 0, r, r * 0.62, 0, 0, TAU);
					ctx.fill();
					ctx.restore();
				}

				function drawMother() {
					const s = scale();
					const mh = MOTHER_H * s;
					const mw = mh * motherAspect();
					const x = w * MOTHER_X;
					const bob = Math.abs(Math.sin(stride * Math.PI)) * 1.1 * s;
					const top = walkY() - mh - bob;

					if (art.mother) ctx.drawImage(art.mother, x - mw / 2, top, mw, mh);
					else drawFigure(null, x, walkY() - mh * 0.46 - bob, s * 1.3, 0, 0, "grip");

					// what is left to give, stacked on the rim
					const rimX = x + mw * (MOTHER_RIM_X - 0.5);
					const rimY = top + mh * MOTHER_RIM_Y;
					const r = mw * MOTHER_RIM_W * 0.17;
					for (let i = 0; i < rice; i++) {
						const row = Math.floor(i / 2);
						const col = i % 2 === 0 ? -0.5 : 0.5;
						cake(rimX + col * r * 1.7 * (row % 2 ? -1 : 1), rimY - r * 0.5 - row * r * 0.9, r, 0);
					}
				}

				function drawCakes() {
					for (const c of cakes) cake(c.x, c.y, c.r, c.rot);
				}

				function draw() {
					drawSky();
					drawStars();
					drawRidge(0);
					drawRidge(1);
					drawRidge(2);
					drawMother();
					drawCakes();
					// The nearest crest passes in front of her, so she is walking the
					// far side of the pass: legs hidden, head and basket on the sky.
					drawRidge(3);
					if (taken) {
						ctx.fillStyle = "rgba(8,10,22," + (clamp01(taken / 1.2) * 0.82).toFixed(3) + ")";
						ctx.fillRect(0, 0, w, h);
					}
					// The eyes sit in front of everything. They are the one thing that
					// must never be lost behind a hill.
					drawTiger();
					drawGrain();
					drawVignette();
				}

				return {
					name: "gate",
					enter,
					update,
					draw,
					down: () => give(),
					up: () => {},
					key: (e) => {
						if (e.key === " " || e.key === "Enter") {
							e.preventDefault();
							give();
						}
					},
					keyUp: () => {},
				};
			})();

			// ── Scene 2 · the door ──────────────────────────────────────────────
			// Their mother's voice is outside asking to be let in. Dragging parts the
			// door, and what comes through the gap is not a hand. Widening it is the
			// only thing the scene asks, and it lets go of itself when you do.
			const sceneDoor = (() => {
				const SEAM = 0.62; // where the door meets its frame
				const GAP_MAX = 0.17; // widest the gap opens, as a fraction of width
				const SPRING = 2.4; // how fast it eases back when released
				const KEEP = 0.4; // how much of the widest hold stays put
				const PAW_AT = 0.3; // slit past which something is in the gap
				const PAW_WRIST = 0.402; // where the wrist sits across the paw art
				const CAP_DOOR = [
					"The voice outside was their mother's. The hand was not.",
					"문틈으로 들어온 것은 손이 아니었다",
				];

				let slit = 0;
				let rest = 0;
				let dragging = false;
				let dragX = 0;
				let dragSlit = 0;
				let keyOpen = false;
				let lamp = 0;
				let out = 0;
				let started = false;

				const seamX = () => w * SEAM;
				// out keeps counting through the change-over, so everything that dims
				// with it reads from a clamped value — a radius or an alpha that goes
				// negative throws.
				const fade = () => clamp01(out / 1.4);
				const floorY = () => h * 0.88;

				function enter() {
					slit = rest = 0;
					dragging = keyOpen = false;
					lamp = 0;
					out = 0;
					started = false;
					elTitle.style.opacity = "0";
					elCap.style.opacity = "1";
					elEn.style.opacity = "0";
					elKo.style.opacity = "0";
					elEnd.style.opacity = "0";
					elAgain.style.opacity = "0";
					elEn.textContent = CAP_DOOR[0];
					elKo.textContent = CAP_DOOR[1];
					elHint.textContent = "문을 옆으로 끌어 보세요";
				}

				function widen(to) {
					if (out) return;
					slit = clamp01(to);
					rest = Math.max(rest, slit * KEEP);
					if (!started && slit > 0.04) {
						started = true;
						elHint.textContent = "";
					}
					if (slit > PAW_AT) {
						elEn.style.opacity = "1";
						elKo.style.opacity = "1";
					}
					if (slit >= 1 && !out) out = 0.0001;
				}

				function update(dt) {
					lamp += dt;
					if (!dragging && !keyOpen && slit > rest) {
						slit = Math.max(rest, slit - dt * SPRING * (slit - rest + 0.25));
					}
					if (keyOpen) widen(slit + dt * 0.55);
					if (out) {
						out += dt;
						if (out > 1.6 && !changing()) goTo(sceneRopes, 0.9);
					}
				}

				// Paper lit from the far side, and the lattice that holds it.
				function drawDoor() {
					const gap = slit * w * GAP_MAX;
					const x = seamX() + gap;
					const moon = 1 - fade() * 0.5;
					ctx.fillStyle = "rgb(20,22,40)";
					ctx.fillRect(x, 0, w - x, h);
					const g = ctx.createLinearGradient(x, 0, w, 0);
					g.addColorStop(0, "rgba(126,150,205," + (0.2 * moon).toFixed(3) + ")");
					g.addColorStop(1, "rgba(126,150,205,0.04)");
					ctx.fillStyle = g;
					ctx.fillRect(x, 0, w - x, h);

					ctx.strokeStyle = "rgba(10,10,20,0.85)";
					ctx.lineWidth = Math.max(1.4, scale() * 1.1);
					ctx.beginPath();
					const step = Math.max(34, h * 0.075);
					for (let gx = x + step * 0.6; gx < w; gx += step) {
						ctx.moveTo(gx, 0);
						ctx.lineTo(gx, h);
					}
					for (let gy = step * 0.6; gy < h; gy += step) {
						ctx.moveTo(x, gy);
						ctx.lineTo(w, gy);
					}
					ctx.stroke();

					ctx.fillStyle = "rgba(8,9,18,0.9)";
					ctx.fillRect(x - Math.max(3, scale() * 2), 0, Math.max(3, scale() * 2), h);
				}

				// Only what fits through the gap is ever seen.
				function drawGap() {
					const gap = slit * w * GAP_MAX;
					if (gap < 1) return;
					const sx = seamX();
					ctx.save();
					ctx.beginPath();
					ctx.rect(sx, 0, gap, h);
					ctx.clip();

					const moon = ctx.createLinearGradient(sx, 0, sx + gap, 0);
					moon.addColorStop(0, "rgba(150,175,225,0.1)");
					moon.addColorStop(0.5, "rgba(170,195,240,0.26)");
					moon.addColorStop(1, "rgba(150,175,225,0.1)");
					ctx.fillStyle = moon;
					ctx.fillRect(sx, 0, gap, h);

					const k = clamp01((slit - PAW_AT) / (1 - PAW_AT));
					if (k > 0) {
						const img = art.paw;
						const py = floorY() - h * 0.13;
						const ph = h * 0.3;
						if (img) {
							const pw = ph * (img.width / img.height);
							// The claws sit just inside the gap and the leg runs back out of
							// it, so widening reveals more limb rather than sliding the foot
							// across. Mirrored, because it reaches in rather than out.
							const toes = sx + w * 0.02;
							ctx.save();
							ctx.translate(toes + pw, py);
							ctx.scale(-1, 1);
							ctx.drawImage(img, 0, -PAW_WRIST * ph, pw, ph);
							ctx.restore();
						} else {
							ctx.fillStyle = "#08090f";
							ctx.fillRect(sx + gap - w * 0.2, py - ph * 0.2, w * 0.2, ph * 0.4);
						}
					}
					ctx.restore();
				}

				function drawRoom() {
					ctx.fillStyle = "rgb(13,12,22)";
					ctx.fillRect(0, 0, seamX(), h);
					const flick = 0.86 + 0.14 * Math.sin(lamp * 7.3) * Math.sin(lamp * 3.1);
					const lx = w * 0.18;
					const ly = floorY() - h * 0.22;
					const rad = h * 0.42 * (1 - fade() * 0.55);
					const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, rad);
					g.addColorStop(0, "rgba(255,196,110," + (0.3 * flick).toFixed(3) + ")");
					g.addColorStop(0.4, "rgba(230,150,80," + (0.1 * flick).toFixed(3) + ")");
					g.addColorStop(1, "rgba(230,150,80,0)");
					ctx.fillStyle = g;
					ctx.fillRect(0, 0, seamX(), h);
					ctx.fillStyle = "#f2c14e";
					ctx.globalAlpha = flick * (1 - fade() * 0.9);
					ctx.beginPath();
					ctx.ellipse(lx, ly, 2.2 * scale(), 3.4 * scale(), 0, 0, TAU);
					ctx.fill();
					ctx.globalAlpha = 1;
				}

				function drawKids() {
					const img = art.siblingsDoor;
					const kh = h * 0.52;
					if (img) {
						const kw = kh * (img.width / img.height);
						// her hand is at the very right of the art, so it lands on the seam
						ctx.drawImage(img, seamX() - kw, floorY() - kh, kw, kh);
						return;
					}
					drawFigure(null, seamX() - kh * 0.22, floorY() - kh * 0.45, scale() * 1.5, 0, 0, "grip");
					drawFigure(null, seamX() - kh * 0.45, floorY() - kh * 0.4, scale() * 1.25, 0, 0, "grip");
				}

				function draw() {
					drawRoom();
					drawDoor();
					drawGap();
					drawKids();
					drawGrain();
					drawVignette();
					if (out) {
						ctx.fillStyle = "rgba(8,10,22," + fade().toFixed(3) + ")";
						ctx.fillRect(0, 0, w, h);
					}
				}

				return {
					name: "door",
					enter,
					update,
					draw,
					down: (e) => {
						e.preventDefault();
						dragging = true;
						dragX = pos(e).x;
						dragSlit = slit;
					},
					move: (e) => {
						if (!dragging) return;
						widen(dragSlit + (pos(e).x - dragX) / (w * GAP_MAX));
					},
					up: () => {
						dragging = false;
					},
					key: (e) => {
						if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
							e.preventDefault();
							keyOpen = true;
						}
					},
					keyUp: (e) => {
						if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") keyOpen = false;
					},
				};
			})();

			let scene = null;
			let pending = null;
			let veil = 0; // 0 clear, 1 blacked out
			let veilDir = 0; // +1 going dark, -1 coming back, 0 settled
			let veilRate = 0;

			// Every scene in this piece ends in the dark, so the blackout lives here
			// rather than in each of them. goTo(s) swaps immediately; goTo(s, 0.8)
			// fades down over 0.8s, enters the new scene behind the black, and lifts.
			function goTo(s, seconds) {
				if (!seconds || !scene) {
					scene = s;
					scene.enter();
					return;
				}
				pending = s;
				veilDir = 1;
				veilRate = 1 / seconds;
			}

			function stepVeil(dt) {
				if (!veilDir) return;
				veil = clamp01(veil + veilDir * veilRate * dt);
				elVeil.style.opacity = veil.toFixed(3);
				if (veilDir > 0 && veil >= 1) {
					scene = pending;
					pending = null;
					scene.enter();
					veilDir = -1;
				} else if (veilDir < 0 && veil <= 0) {
					veilDir = 0;
				}
			}

			const changing = () => veilDir !== 0;

			function frame(now) {
				const dt = Math.min(0.033, (now - last) / 1000);
				last = now;
				t += dt;
				stepVeil(dt);
				scene.update(dt);
				ctx.clearRect(0, 0, w, h);
				scene.draw();
				requestAnimationFrame(frame);
			}

			window.addEventListener("resize", resize);
			cv.addEventListener("pointerdown", (e) => changing() || scene.down(e));
			window.addEventListener("pointermove", (e) => {
				if (!changing() && scene.move) scene.move(e);
			});
			window.addEventListener("pointerup", () => scene.up());
			window.addEventListener("pointercancel", () => scene.up());
			window.addEventListener("keydown", (e) => changing() || scene.key(e));
			window.addEventListener("keyup", (e) => scene.keyUp(e));

			resize();
			makeGrain();
			goTo(sceneGate);
			requestAnimationFrame(frame);
		</script>
	</body>
</html>
