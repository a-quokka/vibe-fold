title: 설화
summary: |
  오래도록 전해 온 이야기를 다시 움직이게 합니다. 세이렌의 해협과 해와 달이 된 오누이를 시작으로, 세계 각지의 설화·전설·신화를 인터랙티브 비주얼 스토리로 펼칩니다.

  한 편의 이야기를 한 명의 작가가 맡아, 읽는 글이 아니라 만지는 화면으로 다시 씁니다. 함께할 작가를 모시고 있습니다.
