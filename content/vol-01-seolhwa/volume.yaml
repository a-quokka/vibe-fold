slug: seolhwa
title: 설화
summary: |
  세계 각지에 흩어진 설화·전설·신화를 인터랙티브 비주얼 스토리로 다시 엮습니다.

  오래전부터 사람들의 입에서 입으로, 신념에서 신념으로 전해 내려온 이야기들에는 지금 우리의 삶과 다르지 않은 질문들이 담겨 있습니다. 우리는 그 이야기를 단순히 '읽는 글'이 아니라, 직접 선택하고 그 결과를 눈으로 확인하는 '체험하는 화면'으로 옮겼습니다.

  한 편의 설화 속으로 들어가, 그 세계의 인물을 마주하는 순간 이야기는 더 이상 과거의 것이 아니라, 지금 우리의 이야기가 됩니다.
