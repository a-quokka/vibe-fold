title: 설화
summary: |
  세계 곳곳에 흩어져 있는 설화와 전설, 신화를 직접 체험해 볼 수 있는 화면으로 다시 엮었어요.

  입에서 입으로 오래 전해 내려온 이야기를 들여다보면, 지금 우리가 품고 있는 질문과 크게 다르지 않아요. 그래서 읽고 넘기는 글이 아니라, 직접 고르고 그 결과를 눈으로 확인하는 화면으로 옮겼어요.

  이야기 속으로 들어가 그 세계의 인물과 마주해 보세요.
